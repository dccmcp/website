<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Terminal output showing read tools auto-approved and write tools awaiting confirmation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", ui-monospace, Menlo, monospace; }
      .dim { fill: #a1a1aa; }
      .fg { fill: #fafafa; }
      .mint { fill: #2dd4bf; }
      .bright { fill: #5eead4; }
      .amber { fill: #fcd34d; }
      .sky { fill: #7dd3fc; }
      .rule { stroke: #27272a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="#27272a"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="56" rx="18" fill="#111113"/>
  <rect x="0" y="38" width="1200" height="18" fill="#111113"/>
  <line x1="0" y1="56" x2="1200" y2="56" class="rule"/>
  <circle cx="32" cy="28" r="6" fill="#3f3f46"/>
  <circle cx="54" cy="28" r="6" fill="#3f3f46"/>
  <circle cx="76" cy="28" r="6" fill="#3f3f46"/>
  <text x="108" y="33" class="mono dim" font-size="15">dccmcp policy plan --profile studio-default</text>

  <g class="mono" font-size="17">
    <text x="40" y="106" class="mint" font-size="15" letter-spacing="2">POLICY PROFILE · STUDIO-DEFAULT</text>
    <line x1="40" y1="124" x2="1160" y2="124" class="rule"/>

    <!-- header row -->
    <text x="40" y="160" class="dim" font-size="13" letter-spacing="1.4">TOOL</text>
    <text x="560" y="160" class="dim" font-size="13" letter-spacing="1.4">ACCESS</text>
    <text x="900" y="160" class="dim" font-size="13" letter-spacing="1.4">DECISION</text>

    <!-- rows -->
    <g font-size="17">
      <text x="40" y="206" class="fg">scene.inspect</text>
      <text x="560" y="206" class="sky">read</text>
      <text x="900" y="206" class="mint">auto-approved</text>
      <line x1="40" y1="226" x2="1160" y2="226" class="rule"/>

      <text x="40" y="272" class="fg">render.capture</text>
      <text x="560" y="272" class="mint">execute</text>
      <text x="900" y="272" class="mint">auto-approved</text>
      <line x1="40" y1="292" x2="1160" y2="292" class="rule"/>

      <text x="40" y="338" class="fg">object.create</text>
      <text x="560" y="338" class="mint">write</text>
      <text x="900" y="338" class="amber">requires approval</text>
      <line x1="40" y1="358" x2="1160" y2="358" class="rule"/>

      <text x="40" y="404" class="fg">mesh.edit</text>
      <text x="560" y="404" class="mint">write</text>
      <text x="900" y="404" class="amber">requires approval</text>
      <line x1="40" y1="424" x2="1160" y2="424" class="rule"/>

      <text x="40" y="470" class="fg">geometry_nodes.set_input</text>
      <text x="560" y="470" class="mint">write</text>
      <text x="900" y="470" class="amber">requires approval</text>
      <line x1="40" y1="490" x2="1160" y2="490" class="rule"/>

      <text x="40" y="536" class="fg">pipeline.checkpoint.restore</text>
      <text x="560" y="536" class="mint">write</text>
      <text x="900" y="536" class="amber">denied in production</text>
      <line x1="40" y1="556" x2="1160" y2="556" class="rule"/>
    </g>

    <text x="40" y="604" class="dim" font-size="14">6 tools · 2 auto-approved · 3 gated · 1 denied · audit: standard</text>
    <rect x="1164" y="592" width="10" height="16" class="mint"/>
  </g>
</svg>
